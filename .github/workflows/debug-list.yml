name: Debug List Artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-22.04
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: 38993504969
          pattern: fork-release-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: List files
        run: |
          find release-assets -type f | sort | while read -r f; do
            size=$(du -h "$f" | cut -f1)
            echo "::notice::$f [$size]"
          done
