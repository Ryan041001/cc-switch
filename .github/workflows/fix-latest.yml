name: Fix latest.json URLs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-22.04
    steps:
      - name: Write fixed latest.json
        run: |
          cat > /tmp/latest.json << 'JSONEOF'
          {
            "version": "4.0.15",
            "notes": "",
            "pub_date": "2026-10-17T03:17:42Z",
            "platforms": {
              "darwin-aarch64": {
                "signature": "",
                "url": "https://github.com/Ryan041001/cc-switch/releases/download/fork-v4.0.15/CC.Switch.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/Ryan041001/cc-switch/releases/download/fork-v4.0.15/CC.Switch_4.0.15_x64_en-US.msi"
              },
              "linux-x86_64": {
                "signature": "",
                "url": "https://github.com/Ryan041001/cc-switch/releases/download/fork-v4.0.15/CC.Switch_4.0.15_amd64.AppImage"
              }
            }
          }
          JSONEOF
          cat /tmp/latest.json | python3 -c "import json,sys; json.load(sys.stdin); print('json valid')"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload fork-v4.0.15 /tmp/latest.json --clobber
          echo "uploaded"
